name: Hent Instagram

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/hent-instagram.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Lagre endringer
        run: |
          git config user.name "instagram-bot"
          git config user.email "bot@users.noreply.github.com"
          git add instagram
          git diff --staged --quiet || git commit -m "Oppdaterte Instagram-poster"
          git push
